name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
  security:
    uses: ./.github/workflows/security-audit.yml
  coverage:
    uses: ./.github/workflows/coverage.yml
  build:
    needs: test
    uses: ./.github/workflows/build.yml
