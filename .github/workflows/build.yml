name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check version and archive binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          path="target/$TARGET/release/sshpod"
          test "$("$path" -V)" = "sshpod $version"
          test "$("$path" --version)" = "sshpod $version - $(git rev-parse HEAD)"
          "$path" --help
          mkdir -p dist
          archive="sshpod-$version-$TARGET"
          mkdir "$archive"
          cp "$path" README.md LICENSE "$archive/"
          tar -czf "dist/$archive.tar.gz" "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: sshpod-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
