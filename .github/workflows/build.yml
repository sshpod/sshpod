---
name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-15-intel
            target: x86_64-apple-darwin

          - build: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get package metadata
        id: package
        shell: bash
        run: |
          name=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          test -n "$name"
          test -n "$version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Branch name
        shell: bash
        run: echo "${GITHUB_REF##*/}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: startsWith(matrix.build, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-dev musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check version and archive binary
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          path="target/$TARGET/release/$PACKAGE_NAME"
          test "$("$path" -V)" = "$PACKAGE_NAME $PACKAGE_VERSION"
          test "$("$path" --version)" = "$PACKAGE_NAME $PACKAGE_VERSION - $(git rev-parse HEAD)"
          "$path" --help
          mkdir -p dist
          archive="$PACKAGE_NAME-$PACKAGE_VERSION-$TARGET"
          mkdir "$archive"
          cp "$path" README.md LICENSE "$archive/"
          tar -czf "dist/$archive.tar.gz" "$archive"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
