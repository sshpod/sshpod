name: Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Run tests with coverage
        run: cargo test --locked --all-features --verbose -- --nocapture
        env:
          RUST_BACKTRACE: full
          CARGO_INCREMENTAL: 0
          LLVM_PROFILE_FILE: coverage-%p-%m.profraw
          RUSTFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off
          RUSTDOCFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off
      - name: Install grcov
        run: cargo install grcov --locked
      - name: Generate coverage report
        run: >-
          grcov . --binary-path target/debug/ -s . -t lcov --branch
          --ignore-not-existing --ignore '../**' --ignore '/*'
          -o target/coverage.lcov
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage.lcov
          if-no-files-found: error
          retention-days: 14
