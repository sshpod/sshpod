[package]
name = "sshpod"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "Podman development workspaces, locally or over SSH"
repository = "https://github.com/sshpod/sshpod"
documentation = "https://github.com/sshpod/sshpod#readme"
readme = "README.md"
license = "BSD-3-Clause"
keywords = ["podman", "ssh", "development", "containers", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/**"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
